plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.gms.google-services'
}

def releaseSigningProp = { String key ->
    return providers.gradleProperty(key)
        .orElse(providers.environmentVariable(key))
        .orNull
}

def releaseStoreFilePath = releaseSigningProp('SMS_SEGURO_RELEASE_STORE_FILE')
def releaseStorePassword = releaseSigningProp('SMS_SEGURO_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningProp('SMS_SEGURO_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSigningProp('SMS_SEGURO_RELEASE_KEY_PASSWORD')

def hasReleaseSigningConfig =
    [releaseStoreFilePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { value ->
        value != null && !value.trim().isEmpty()
    }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

android {
    namespace 'com.smsguard'
    compileSdk 35

    defaultConfig {
        applicationId "com.smsguard"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.1-alpha"

        buildConfigField "String", "RULESET_JSON_URL", "\"https://raw.githubusercontent.com/LoadingHappiness-cg/SMS_Seguro/main/rules/ruleset-latest.json\""
        buildConfigField "String", "RULESET_SIG_URL", "\"https://raw.githubusercontent.com/LoadingHappiness-cg/SMS_Seguro/main/rules/ruleset-latest.sig\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    lint {
        abortOnError true
        warningsAsErrors false
        checkDependencies true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "sms-seguro-${variant.versionName}.apk"
        }
    }
}

tasks.configureEach { task ->
    if ((task.name == 'assembleRelease' || task.name == 'bundleRelease') && !hasReleaseSigningConfig) {
        task.doFirst {
            throw new GradleException(
                "Release signing credentials are missing. Define SMS_SEGURO_RELEASE_STORE_FILE, " +
                    "SMS_SEGURO_RELEASE_STORE_PASSWORD, SMS_SEGURO_RELEASE_KEY_ALIAS, and " +
                    "SMS_SEGURO_RELEASE_KEY_PASSWORD in ~/.gradle/gradle.properties or environment variables."
            )
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Allowed Dependencies
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2"
    
    // Icons
    implementation "androidx.compose.material:material-icons-extended"

    // Crash reporting
    implementation "com.google.firebase:firebase-crashlytics-ktx:19.0.3"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
