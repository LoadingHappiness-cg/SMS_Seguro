services:
  link-enrichment:
    build:
      context: .
      dockerfile: Dockerfile
    image: sms-seguro-link-enrichment:latest
    container_name: sms-seguro-link-enrichment
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
